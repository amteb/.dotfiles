[package]
format = "[|](bright-black) [$symbol$version]($style) "
symbol = " "

[perl]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[php]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[pijul_channel]
format = "[|](bright-black) [$symbol$channel]($style) "
symbol = " "

[pixi]
format = "[|](bright-black) [$symbol$version( $environment)]($style) "
symbol = " "

[pulumi]
format = "[|](bright-black) [$symbol$stack]($style) "

[purescript]
format = "[|](bright-black) [$symbol($version)]($style) "

[python]
format = "[|](bright-black) [${symbol}${pyenv_prefix}(${version})(\\($virtualenv\\))]($style) "
style = "bold blue"
symbol = " "

[quarto]
format = "[|](bright-black) [$symbol($version)]($style) "

[raku]
format = "[|](bright-black) [$symbol($version-$vm_version)]($style) "

[red]
format = "[|](bright-black) [$symbol($version)]($style) "

[rlang]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[ruby]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[rust]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[scala]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[shell]
style = "cyan bold"
bash_indicator = "b"
zsh_indicator = "z"
fish_indicator = "><>"
powershell_indicator = "_"
cmd_indicator = "c"
unknown_indicator = "mystery shell"

[singularity]
format = "[|](bright-black) [$symbol\\[$env\\]]($style) "

[solidity]
format = "[|](bright-black) [$symbol($version)]($style) "

[spack]
format = "[|](bright-black) [$symbol$environment]($style) "

[status]
format = "[|](bright-black) [$symbol$status]($style) "
symbol = " "

[sudo]
format = "[|](bright-black) [as $symbol]($style) "

[swift]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[terraform]
format = "[|](bright-black) [$symbol$workspace]($style) "

[time]
format = "[|](bright-black) [$time]($style) "

[typst]
format = "[|](bright-black) [$symbol($version)]($style) "

[username]
format = "[|](bright-black) [$user]($style) "

[vagrant]
format = "[|](bright-black) [$symbol($version)]($style) "

[vcsh]
format = "[|](bright-black) vcsh [$symbol$repo]($style) "

[vlang]
format = "[|](bright-black) [$symbol($version)]($style) "

[xmake]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[zig]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[directory]
read_only = " "
