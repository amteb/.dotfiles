"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
continuation_prompt = "[.](bright-black) "
format = """
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$nats\
$direnv\
$env_var\
$mise\
$crystal\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$os\
$container\
$netns\
$shell\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[V](bold green)"

[aws]
format = "[|](bright-black) [$symbol($profile)(\\($region\\))(\\[$duration\\])]($style) "
symbol = " "

[azure]
format = "[|](bright-black) [$symbol($subscription)]($style) "

[battery]
format = "[|](bright-black) [$symbol$percentage]($style) "

[buf]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[bun]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[c]
disabled = false
format = "[|](bright-black) [$symbol($version(-$name))]($style) "
symbol = " "
commands = [
    [
        "/opt/homebrew/opt/gcc/bin/gcc-15",
        "--version",
    ],
]

[cpp]
disabled = false
format = "[|](bright-black) [$symbol($version(-$name))]($style) "
symbol = " "
commands = [
    [
      "/opt/homebrew/opt/llvm/bin/clang++",
      "--version",
    ],
    [
        "clang++",
        "--version",
    ],
]

[cmake]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[cmd_duration]
format = "[|](bright-black) [⏱ $duration]($style) "

[cobol]
format = "[|](bright-black) [$symbol($version)]($style) "

[conda]
format = "[|](bright-black) [$symbol$environment]($style) "
symbol = " "

[container]
format = "[|](bright-black) [$symbol \\[$name\\]]($style) "

[crystal]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[daml]
format = "[|](bright-black) [$symbol($version)]($style) "

[dart]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[deno]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[direnv]
disabled = false
format = "[|](bright-black) [$symbol]($style)[$loaded/$allowed](7) "
symbol = " "
allowed_msg = "a"
not_allowed_msg = "n"
denied_msg = "d"
loaded_msg = "l"
unloaded_msg = "u"

[docker_context]
format = "[|](bright-black) [$symbol$context]($style) "
symbol = " "

[dotnet]
format = "[|](bright-black) [$symbol($version)(🎯 $tfm)]($style) "

[elixir]
format = "[|](bright-black) [$symbol($version \\(OTP $otp_version\\))]($style) "
symbol = " "

[elm]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[erlang]
format = "[|](bright-black) [$symbol($version)]($style) "

[fennel]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[fortran]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[fossil_branch]
format = "[|](bright-black) [$symbol$branch]($style) "
symbol = " "

[fossil_metrics]
format = "[|](bright-black) [+$added]($added_style)\\]\\[[-$deleted]($deleted_style) "

[gcloud]
format = "[|](bright-black) [$symbol$account(@$domain)(\\($region\\))]($style) "
symbol = " "

[git_branch]
format = "[$branch]($style)"
style = "bold 7"
symbol = " "

[git_commit]
format = "[|](bright-black) [\\($hash$tag\\)]($style) "
tag_symbol = "  "

[git_metrics]
format = "[|](bright-black) [+$added]($added_style)\\]\\[[-$deleted]($deleted_style) "
disabled = true

[git_state]
format = "[|](bright-black) [$state ($progress_current/$progress_total)]($style) "

[git_status]
format = """
[$conflicted](red)\
[$deleted](red)\
[$renamed](yellow)\
[$modified](yellow)\
[$typechanged](yellow)\
[$staged](green)\
[$untracked](green)\
[$stashed](bright-black)\
[$ahead_behind](cyan) """
conflicted = "c"
deleted = "x"
renamed = "r"
modified = "m"
typechanged = "t"
staged = "g"
untracked = "u"
stashed = "s"
ahead = "a"
behind = "b"
diverged = "d"
use_git_executable = true

[gleam]
format = "[|](bright-black) [$symbol($version)]($style) "

[golang]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[gradle]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[guix_shell]
format = "[|](bright-black) [$symbol]($style) "
symbol = " "

[haskell]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[haxe]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[helm]
format = "[|](bright-black) [$symbol($version)]($style) "

[hg_branch]
format = "[|](bright-black) [$symbol$branch]($style) "
symbol = " "

[hostname]
format = "[|](bright-black) [$ssh_symbol($hostname)]($style) "
ssh_symbol = " "

[java]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[jobs]
format = "[|](bright-black) [$symbol$number]($style) "

[julia]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[kotlin]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[kubernetes]
format = "[|](bright-black) [$symbol$context( \\($namespace\\))]($style) "

[localip]
format = "[|](bright-black) [$localipv4]($style) "

[lua]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[memory_usage]
format = "[|](bright-black) $symbol[$ram( | $swap)]($style) "
symbol = " "

[meson]
format = "[|](bright-black) [$symbol$project]($style) "
symbol = " "

[mise]
format = "[|](bright-black) [$symbol$health]($style) "

[mojo]
format = "[|](bright-black) [$symbol($version)]($style) "

[nats]
format = "[|](bright-black) [$symbol$name]($style) "

[netns]
format = "[|](bright-black) [$symbol \\[$name\\]]($style) "

[nim]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[nix_shell]
format = "[|](bright-black) [$symbol$state( \\($name\\))]($style) "
symbol = " "

[nodejs]
format = "[|](bright-black) [$symbol($version)]($style) "
symbol = " "

[ocaml]
format = "[|](bright-black) [$symbol($version) (\\($switch_indicator$switch_name\\))]($style) "
symbol = " "

[odin]
format = "[|](bright-black) [$symbol($version )]($style) "

[opa]
format = "[|](bright-black) [$symbol($version)]($style) "

[openstack]
format = "[|](bright-black) [$symbol$cloud(\\($project\\))]($style) "

[os]
format = "[|](bright-black) [$symbol]($style) "
disabled = true

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
CachyOS = " "
